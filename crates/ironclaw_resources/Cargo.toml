[package]
name = "ironclaw_resources"
version = "0.1.0"
edition = "2024"
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Resource reservation governor for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# Exposes `test_support` in-memory-backed store constructors for downstream
# crates' tests. Disabled by default; enable only from [dev-dependencies].
test-support = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
fs2 = "0.4.3"
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
rust_decimal = { version = "1.42.1", features = ["serde", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
async-trait = "0.1.91"
rust_decimal_macros = "1.40.0"
tempfile = "3.27.0"
