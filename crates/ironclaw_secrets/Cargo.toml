[package]
name = "ironclaw_secrets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
aes-gcm = "0.11.0"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
hkdf = "0.13"
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
rand = "0.10.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
