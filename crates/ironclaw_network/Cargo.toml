[package]
name = "ironclaw_network"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1.91"
ironclaw_host_api = { path = "../ironclaw_host_api" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-tls-native-roots"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time", "net", "io-util"] }
