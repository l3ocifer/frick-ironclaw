[package]
name = "ironclaw_host_api"
version = "0.1.0"
edition = "2024"
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Shared host API contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "contracts"

[features]
# Dev-only seam (rule: cargo-features.md bar #4 — the sanctioned `test-support`
# name). Compiles the shared `TestDispatcher` `CapabilityDispatcher` double so
# downstream crates stop hand-rolling ~25 one-method dispatcher fakes. Never
# enabled by a shipped artifact.
test-support = []
host-auth-mint = []

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.42.1", features = ["serde", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.19"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
rust_decimal_macros = "1.40.0"
static_assertions = "1.1.0"
toml = "1.1.3"
# `#[tokio::test]` for the async `dispatch_test_support::TestDispatcher` tests.
tokio = { version = "1.53.1", features = ["macros", "rt"] }
