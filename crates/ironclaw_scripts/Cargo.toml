[package]
name = "ironclaw_scripts"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
ironclaw_extensions = { path = "../ironclaw_extensions" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_resources = { path = "../ironclaw_resources" }
futures-util = "0.3.33"
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
async-trait = "0.1.91"
rust_decimal_macros = "1.40.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
