[package]
name = "ironclaw_turns"
version = "0.1.0"
edition = "2024"
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Host-layer turn coordination contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# In-memory turn-state store double (`test_support::in_memory_turn_state_store`)
# for cross-crate tests. Enabled via dev-dependencies; never in production.
test-support = ["ironclaw_host_api/test-support"]
# Enables trusted host-only helpers that mark product ingress authentication as
# verified. Product terminals must not enable this directly.
host-auth-mint = ["ironclaw_host_api/host-auth-mint"]

[dependencies]
async-trait = "0.1.91"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.33"
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
ironclaw_observability = { path = "../ironclaw_observability" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_jcs = "0.2"
sha2 = "0.11"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
# Self-reference so the crate's own integration tests see `test_support`.
ironclaw_turns = { path = ".", features = ["test-support"] }
# FaultInjecting decorator: drive store fault paths through the real
# `TurnStateRowStore` instead of a hand-rolled whole-trait fake.
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0", features = [
    "test-support",
] }
# Test-only: the durable-read perf harness (`events_query_stress`) builds a real
# libSQL-backed store.
libsql = { version = "0.9.30", default-features = false, features = [
    "core",
    "replication",
    "remote",
    "tls",
] }
# Optional live-Postgres durable replay contract (skips when no test database
# URL is configured). Versions match the workspace integration harness.
deadpool-postgres = "0.14.1"
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
rand = "0.10.2"
static_assertions = "1.1.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "time",
] }
