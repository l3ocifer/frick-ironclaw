[package]
name = "ironclaw_common"
version = "0.4.2"
edition = "2024"
rust-version.workspace = true
description = "Shared types, paths, and platform helpers used across the IronClaw workspace"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"

[package.metadata.ironclaw]
layer = "contracts"

[package.metadata.dist]
dist = false

[dependencies]
base64 = "0.23.0"
chrono-tz = "0.10.4"
dirs = "6"
hex = "0.4.3"
rand = "0.10.2"
rust_decimal = { version = "1.42.1", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
