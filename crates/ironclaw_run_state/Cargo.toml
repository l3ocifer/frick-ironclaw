[package]
name = "ironclaw_run_state"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# In-memory-backed run-state / approval-request store constructors for this
# crate's own tests and downstream tiers. The stores are the production
# `Filesystem*Store<InMemoryBackend>`; the helpers just wire the in-memory backend
# seam (arch-simplification §4.3).
test-support = []

[dependencies]
async-trait = "0.1.91"
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
