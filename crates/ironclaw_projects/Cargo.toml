[package]
name = "ironclaw_projects"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "First-class Project entity, membership, and access control for IronClaw Reborn"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
ulid = { version = "1.2.1", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
