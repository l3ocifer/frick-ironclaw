[package]
name = "ironclaw_skills"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Skill selection, scoring, and management for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"

[package.metadata.ironclaw]
layer = "loops"

[package.metadata.dist]
dist = false

[features]
default = ["registry", "catalog"]
registry = ["dep:tempfile"]
catalog = ["dep:reqwest", "dep:urlencoding", "dep:futures"]

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
libc = "0.2.189"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["sync", "process", "fs"] }
tracing = "0.1.44"

# Optional (catalog feature)
futures = { version = "0.3.33", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }
urlencoding = { version = "2.1.3", optional = true }

# Optional (registry feature — tempfile needed for dev-dep in tests, but also
# the registry module itself uses no extra deps beyond tokio::fs)
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
# FaultInjecting decorator: test store fault paths through the real store.
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
