name: labeler

# Forgejo Actions sibling of .github/workflows/labeler.yml.
# Forgejo proxies actions/* from the GH Marketplace, so the same
# labeler action works; the labels live in Forgejo, not GitHub.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
