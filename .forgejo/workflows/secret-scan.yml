name: secret-scan

# Forgejo Actions sibling of .github/workflows/secret-scan.yml.
# Uses the gitleaks binary directly so we don't depend on the
# GitHub-flavored gitleaks-action (which posts SARIF to GitHub
# code-scanning, an endpoint Forgejo doesn't expose).

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --log-opts="--all"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
