name: secret-scan

# Forgejo Actions sibling of .github/workflows/secret-scan.yml.
# Uses the gitleaks binary directly so we don't depend on the
# GitHub-flavored gitleaks-action (which posts SARIF to GitHub
# code-scanning, an endpoint Forgejo doesn't expose).

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --log-opts="--all"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
