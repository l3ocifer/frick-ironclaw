# Reborn operator config for Frick (in-cluster, hosted-single-tenant).
#
# Read once at startup from $IRONCLAW_REBORN_HOME/config.toml. The container
# cannot mount a ConfigMap directly into that path because
# IRONCLAW_REBORN_HOME lives on the writable state PVC, so an initContainer
# copies this file into place (see homelab/k8s/deployment.yaml).
#
# This replaces homelab/config/openclaw.json, which the deleted v1 legacy
# binary read. See homelab/PATCHES.md for what did NOT carry over.
api_version = "ironclaw.runtime/v1"

[boot]
# Postgres-backed single tenant. The database, role and password already
# exist for this agent (CNPG `ironclaw_frick` on homelab-pg); the URL is
# supplied as IRONCLAW_REBORN_POSTGRES_URL from the existing DATABASE_URL
# key in the frick-secrets SealedSecret.
profile = "hosted-single-tenant"

[identity]
default_owner = "frick"
tenant = "frick"
default_agent = "frick"

[runner]
heartbeat_interval_secs = 5
poll_interval_ms = 200
# One elected turn-runner authority; let the provider and the storage pool be
# the bottleneck rather than an in-process semaphore (upstream's guidance for
# this profile). Per-user and trigger caps still use the compiled defaults.
worker_count = 0

[skills]
regex_activation_enabled = true

# Required by the hosted-single-tenant profile — the entrypoint refuses to
# start without it, and the runtime has no Postgres to reach otherwise. Both
# env vars are supplied by the Deployment from the frick-secrets SealedSecret
# (DATABASE_URL and SECRETS_MASTER_KEY respectively); by contract these are
# variable NAMES, never values.
[storage]
backend = "postgres"
url_env = "IRONCLAW_REBORN_POSTGRES_URL"
secret_master_key_env = "IRONCLAW_REBORN_SECRET_MASTER_KEY"
pool_max_size = 32

[webui]
# Names only — never values. `ironclaw serve` exits before binding the
# listener if either of these resolves empty.
env_token_var = "IRONCLAW_REBORN_WEBUI_TOKEN"
env_user_id_var = "IRONCLAW_REBORN_WEBUI_USER_ID"

# Route the agent at the in-cluster LiteLLM rather than NearAI, which is what
# the bundled config would otherwise select. The built-in `openai_compatible`
# provider reads LLM_BASE_URL and LLM_API_KEY, which are the same env vars the
# legacy binary used, so the LiteLLM wiring in the Deployment is unchanged.
# `api_key_env` is an env-var NAME by contract; an inline secret here is
# rejected at validation.
[llm.default]
provider_id = "openai_compatible"
model = "chat"
api_key_env = "LLM_API_KEY"
base_url = "http://litellm.inference.svc.cluster.local:4000/v1"
