---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frick
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: frick
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: agents
spec:
  # PAUSED 2026-08-22 — inference lane reserved for laptop/dev setup until alef's 3090
  # is back. Reversal: `git revert` this commit (see homelab docs/agents-inference-pause.md).
  replicas: 0  # was: replicas: 1
  strategy:
    type: Recreate                    # state PVC is RWO
  selector:
    matchLabels:
      app.kubernetes.io/name: frick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frick
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: frick-ops
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [alef, thebeast, blade] }
          # Soft-prefer alef (RTX 3090 → fastest local-LLM routing).
          # Will tolerate eviction to thebeast or any other worker.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [alef] }
            - weight: 30
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [thebeast] }
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      initContainers:
        # Ensure the deliverable dir exists and is owned by the agent uid.
        # IronClaw's write_file tool resolves relative paths (the orchestrator
        # dispatches workspace-relative `world/<file>.md`) against the process
        # cwd — set to /data/graphs/frick/pages below — so this dir must exist
        # at boot or the container's workingDir would be invalid. Runs as uid
        # 1000 (image USER `ironclaw`) so files the agent writes are owned by it.
        - name: seed-graph-dir
          image: busybox:1.37
          securityContext: { runAsUser: 1000, runAsGroup: 0 }
          command: ["sh", "-c", "mkdir -p /data/graphs/frick/pages/world"]
          volumeMounts:
            - { name: graph-frick, mountPath: /data/graphs/frick }
        # Reborn reads $IRONCLAW_REBORN_HOME/config.toml and needs that home
        # writable, so the ConfigMap cannot be mounted there directly. Copy it
        # in on every start (same seed-a-writable-copy pattern frack/puck
        # use). Overwrites unconditionally so the ConfigMap stays the source
        # of truth; because disableNameSuffixHash is set, editing the config
        # does not roll the Deployment by itself — restart it to pick up a
        # change.
        - name: seed-reborn-config
          image: busybox:1.37
          securityContext: { runAsUser: 1000, runAsGroup: 0 }
          command:
            - sh
            - -c
            - mkdir -p /data/reborn && cp /etc/ironclaw/reborn/config.toml /data/reborn/config.toml
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: reborn-config, mountPath: /etc/ironclaw/reborn, readOnly: true }
        # Reborn's Postgres client trusts whatever rustls-native-certs finds,
        # which is the SSL_CERT_FILE/SSL_CERT_DIR pair or the system default.
        # There is no CA-file knob on the connection, so the only way to trust
        # CNPG's per-cluster CA is to put it in the trust store the process
        # reads. Pointing SSL_CERT_FILE at the CA alone would *replace* the
        # public roots and break every outbound HTTPS call in the container
        # (LiteLLM, gh, bw), so concatenate: public roots first, CNPG CA
        # appended.
        #
        # This runs on the agent image rather than busybox because it has to
        # read that image's own ca-certificates bundle — busybox ships none.
        - name: build-ca-bundle
          image: git.leopaska.xyz/leo/frick-ironclaw:homelab
          imagePullPolicy: Always
          securityContext: { runAsUser: 0 }
          command:
            - sh
            - -c
            - |
              set -e
              cat /etc/ssl/certs/ca-certificates.crt /etc/homelab/pg-ca/ca.crt \
                > /etc/homelab/tls/ca-bundle.crt
              chmod 0644 /etc/homelab/tls/ca-bundle.crt
              echo "ca-bundle: $(grep -c 'BEGIN CERTIFICATE' /etc/homelab/tls/ca-bundle.crt) certificates"
          volumeMounts:
            - { name: pg-ca,     mountPath: /etc/homelab/pg-ca, readOnly: true }
            - { name: ca-bundle, mountPath: /etc/homelab/tls }
      containers:
        - name: ironclaw
          image: git.leopaska.xyz/leo/frick-ironclaw:homelab
          imagePullPolicy: Always
          # No `command:` — the image entrypoint is upstream's
          # ironclaw-reborn-entrypoint (under tini), which installs a default
          # config if the PVC has none and refuses to start when the profile's
          # required sections are missing. Overriding it with `ironclaw`
          # directly skips that check and turns a bad config into a
          # half-initialised runtime instead of a clear error.
          #
          # Reborn runtime (upstream deleted the v1 legacy monolith that
          # `--no-onboard run` belonged to). `serve` is the long-running
          # command; Reborn's `run` only initializes a runtime shell and
          # exits, which would crashloop here.
          args: ["serve", "--host", "0.0.0.0", "--port", "3000"]
          # Root the process cwd at the Logseq graph's pages dir so the
          # agent's filesystem write tool persists workspace-relative
          # deliverables (e.g. `world/cluster-state.md`) into the RWX graph the
          # mission-orchestrator verifies. Without this, relative writes
          # landed in the ephemeral /home/ironclaw and missions never closed.
          workingDir: /data/graphs/frick/pages
          ports:
            - { name: gateway, containerPort: 3000, protocol: TCP }
            - { name: metrics, containerPort: 9100, protocol: TCP }
          env:
            - { name: AGENT_NAME, value: "Frick" }
            - { name: AGENT_ID, value: "frick" }
            - { name: TZ, value: "America/New_York" }
            - { name: HARDSTOP_PATH, value: "/data/HARDSTOP-FRICK" }
            - { name: GATEWAY_ENABLED, value: "true" }
            - { name: GATEWAY_HOST, value: "0.0.0.0" }
            - { name: GATEWAY_PORT, value: "3000" }
            # Stable M2M token for agent-bus + A2A callers (matches A2A_BEARER_TOKEN).
            - name: GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frick-secrets
                  key: A2A_BEARER_TOKEN
            - { name: CLI_ENABLED, value: "false" }
            - { name: LLM_BACKEND, value: "openai_compatible" }
            - { name: LLM_BASE_URL, value: "http://litellm.inference.svc.cluster.local:4000/v1" }
            - { name: LLM_MODEL, value: "chat" }
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frick-secrets
                  key: LITELLM_API_KEY
            - { name: IRONCLAW_PERSONA_DIR, value: "/etc/ironclaw/persona" }
            # ── Reborn runtime ──────────────────────────────────────────
            # Home must be writable: Reborn keeps its config, state and
            # first-run marker here, so it sits on the state PVC.
            - { name: IRONCLAW_REBORN_HOME, value: "/data/reborn" }
            - { name: IRONCLAW_REBORN_PROFILE, value: "hosted-single-tenant" }
            # Reuses the CNPG database this agent already owns. DATABASE_URL
            # is the same key the legacy binary consumed via envFrom.
            - name: IRONCLAW_REBORN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: frick-secrets
                  key: DATABASE_URL
            - name: IRONCLAW_REBORN_SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: frick-secrets
                  key: SECRETS_MASTER_KEY
            # Required opt-in: the runtime refuses to start unless the operator
            # asserts that this process is the only resource-governor for its
            # Postgres database. That holds here — frick owns `ironclaw_frick`
            # alone, and replicas:1 with strategy Recreate means no second pod
            # ever overlaps. If this Deployment is ever scaled past 1, or the
            # strategy changes to RollingUpdate, this assertion becomes false
            # and two governors will race over the same tables.
            - { name: IRONCLAW_REBORN_POSTGRES_RESOURCE_GOVERNOR_SINGLETON, value: "true" }
            # Verified TLS to CNPG. This overrides the `?sslmode=disable` still
            # baked into the DATABASE_URL secret — the env var is applied to
            # the parsed DSN, so the secret does not need resealing.
            #
            # Reborn's `require` is stricter than libpq's: it validates the
            # full chain *and* the hostname. Both hold here —
            # homelab-pg-rw.databases.svc.cluster.local is in the server
            # cert's SANs, and the CNPG CA reaches this namespace via the
            # cnpg-ca-sync CronJob (homelab argocd/apps/_agents/cnpg-ca-sync).
            # That job re-copies every 6h, so CNPG's 90-day CA rotation is
            # tracked without a pinned copy in git.
            - { name: DATABASE_SSLMODE, value: "require" }
            # Trust store assembled by the build-ca-bundle initContainer:
            # public roots plus the CNPG CA. rustls-native-certs reads this,
            # and so does every OpenSSL-based tool in the image.
            - { name: SSL_CERT_FILE, value: "/etc/homelab/tls/ca-bundle.crt" }
            # Same M2M token the agent-bus and A2A callers already present,
            # so existing callers keep working against the Reborn WebUI.
            - name: IRONCLAW_REBORN_WEBUI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frick-secrets
                  key: A2A_BEARER_TOKEN
            - { name: IRONCLAW_REBORN_WEBUI_USER_ID, value: "frick" }
            # Mission deliverables are real files on the RWX graph, not the
            # Postgres-backed `memory_write` workspace. Enable the local
            # filesystem/shell tools (write_file, shell) and auto-approve them
            # so unattended mission turns can persist `world/<file>.md` without
            # an interactive approver wedging the turn.
            - { name: ALLOW_LOCAL_TOOLS, value: "true" }
            - { name: AGENT_AUTO_APPROVE_TOOLS, value: "true" }
          envFrom:
            - secretRef: { name: frick-secrets }
          livenessProbe:
            httpGet: { path: /api/health, port: gateway }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /api/health, port: gateway }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { memory: "8Gi" }
          volumeMounts:
            - { name: state,           mountPath: /data }
            - { name: ca-bundle,       mountPath: /etc/homelab/tls, readOnly: true }
            - { name: persona,         mountPath: /etc/ironclaw/persona, readOnly: true }
            - { name: ironclaw-config, mountPath: /etc/ironclaw/openclaw.json, subPath: openclaw.json, readOnly: true }
            - { name: graph-frick,     mountPath: /data/graphs/frick }
            - { name: graph-frack,     mountPath: /data/graphs/frack,    readOnly: true }
            - { name: graph-sancho,    mountPath: /data/graphs/sancho,   readOnly: true }
            - { name: graph-vetinari,  mountPath: /data/graphs/vetinari, readOnly: true }
            - { name: graph-quirm,     mountPath: /data/graphs/quirm,    readOnly: true }
            - { name: graph-vimes,     mountPath: /data/graphs/vimes,    readOnly: true }
            - { name: graph-puck,      mountPath: /data/graphs/puck,     readOnly: true }
            - { name: graph-leo,       mountPath: /data/graphs/leo }
              # Restricted writes per HANDOFF.md §4 — runtime-enforced
      volumes:
        - { name: state,            persistentVolumeClaim: { claimName: frick-state } }
        - { name: persona,          configMap: { name: frick-persona } }
        - { name: ironclaw-config,  configMap: { name: frick-ironclaw-config } }
        - { name: reborn-config,    configMap: { name: frick-reborn-config } }
        # Deliberately not `optional` — if cnpg-ca-sync has not populated this
        # secret the pod should fail on a missing-secret event, not boot with a
        # trust store that silently omits the CNPG root and surface it later as
        # an opaque TLS handshake error.
        - { name: pg-ca,            secret: { secretName: homelab-pg-ca } }
        - { name: ca-bundle,        emptyDir: {} }
        - { name: graph-frick,      persistentVolumeClaim: { claimName: frick-graph } }
        - { name: graph-frack,      persistentVolumeClaim: { claimName: frack-graph } }
        - { name: graph-sancho,     persistentVolumeClaim: { claimName: sancho-graph } }
        - { name: graph-vetinari,   persistentVolumeClaim: { claimName: vetinari-graph } }
        - { name: graph-quirm,      persistentVolumeClaim: { claimName: quirm-graph } }
        - { name: graph-vimes,      persistentVolumeClaim: { claimName: vimes-graph } }
        - { name: graph-puck,       persistentVolumeClaim: { claimName: puck-graph } }
        - { name: graph-leo,        persistentVolumeClaim: { claimName: leo-graph } }
      imagePullSecrets:
        - { name: forgejo-registry-credentials }
