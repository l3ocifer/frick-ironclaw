apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Frick — IronClaw cluster-ops agent. Floats across the cluster with
# soft-preference for alef (RTX 3090 → fast local-LLM routing).
# Lives in `agents-shared` alongside Vetinari, Frack, Sancho, the
# graph PVCs, and syncthing-graphs.

namespace: agents-shared

resources:
  - pvc.yaml
  - rbac.yaml
  - service.yaml
  - ingressroute.yaml
  - deployment.yaml

configMapGenerator:
  - name: frick-persona
    files:
      - SOUL.md=../config/SOUL.md
      - TOOLS.md=../config/TOOLS.md
      - AGENTS.md=../shared/openclaw-configs/shared/AGENTS.md
      - HANDOFF.md=../shared/openclaw-configs/shared/HANDOFF.md
      - KILLSWITCH.md=../shared/openclaw-configs/shared/KILLSWITCH.md
      - USER.md=../shared/openclaw-configs/shared/USER.md
  - name: frick-ironclaw-config
    files:
      - openclaw.json=../config/openclaw.json

generatorOptions:
  disableNameSuffixHash: false

commonLabels:
  app.kubernetes.io/name: frick
  app.kubernetes.io/part-of: agents
  app.kubernetes.io/managed-by: argocd
