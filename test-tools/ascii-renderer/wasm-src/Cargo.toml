[package]
name = "ascii-renderer-tool"
version = "0.1.0"
edition = "2021"
description = "Canned ASCII-art extension for IronClaw (#5459 no-network test fixture, WASM component)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.60.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
